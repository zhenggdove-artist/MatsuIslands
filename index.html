<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斷罪塔</title></head><body style="background:#080808;color:#f4d66f"><p id="loading">正在載入遊戲…</p><script>(async()=>{try{const names=["game/part-0000.bin","game/part-0001.bin","game/part-0002.bin","game/part-0003.bin","game/part-0004.bin","game/part-0005.bin","game/part-0006.bin","game/part-0007.bin","game/part-0008.bin","game/part-0009.bin","game/part-0010.bin","game/part-0011.bin","game/part-0012.bin","game/part-0013.bin","game/part-0014.bin","game/part-0015.bin","game/part-0016.bin","game/part-0017.bin","game/part-0018.bin","game/part-0019.bin","game/part-0020.bin","game/part-0021.bin","game/part-0022.bin","game/part-0023.bin","game/part-0024.bin","game/part-0025.bin","game/part-0026.bin","game/part-0027.bin","game/part-0028.bin","game/part-0029.bin","game/part-0030.bin","game/part-0031.bin","game/part-0032.bin","game/part-0033.bin"];const parts=[];for(const name of names){const r=await fetch(new URL(name,location.href));if(!r.ok)throw Error(name+" HTTP "+r.status);parts.push(await r.arrayBuffer());}const html=await new Blob(parts).text();document.open();document.write(html);document.close();}catch(e){document.getElementById("loading").textContent="遊戲載入失敗："+e.message;}})();</script></body></html>
